<!doctype html>
<html lang="{{ page.lang | default: site.lang }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class }}">
{% if page.curtain %}<div class="curtain" aria-hidden="true"><span>Zakaria Fatahi</span></div>{% endif %}
{% include nav.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="/assets/js/site.js?v={{ site.time | date: '%s' }}" defer></script>
{% if page.mermaid %}
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.esm.min.mjs';
  const dark = document.documentElement.getAttribute('data-theme') === 'dark' || (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  document.querySelectorAll('pre > code.language-mermaid').forEach((code) => {
    const div = document.createElement('div'); div.className = 'mermaid'; div.textContent = code.textContent;
    const pre = code.parentElement; (pre.closest('.highlighter-rouge') || pre).replaceWith(div);
  });
  mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'neutral' });
  mermaid.run();
</script>
{% endif %}
</body>
</html>

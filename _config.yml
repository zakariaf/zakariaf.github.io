title: Zakaria Fatahi
description: Founding Engineer and AI Engineer at Stewark. Apps, startups, open source and agent skills, from Berlin.
url: https://zakaria.dev
baseurl: ""
lang: en
timezone: Europe/Berlin
author:
  name: Zakaria Fatahi
  twitter: zakariaf_dev
twitter:
  username: zakariaf_dev
social:
  name: Zakaria Fatahi
  links:
    - https://www.linkedin.com/in/zakaria-fatahi
    - https://github.com/zakariaf
    - https://x.com/zakariaf_dev
    - https://www.youtube.com/@zakariafatahi
image: /assets/img/og.png

# Old post URLs (/posts/<slug>/) keep working.
permalink: /posts/:title/

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude: [Gemfile, Gemfile.lock, vendor, .github, README.md, node_modules]
